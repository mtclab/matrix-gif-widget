# Matrix GIF Widget — nginx reverse proxy config
# Place in /etc/nginx/sites-available/gif-widget
# Symlink to /etc/nginx/sites-enabled/gif-widget
# Adjust server_name to your actual domain
#
# SECURITY: The Express server sends CSP with frame-ancestors.
# Set FRAME_ANCESTORS env var in docker-compose to control which
# Matrix clients can embed this widget. Default: 'self'
# For Element Web, use: FRAME_ANCESTORS='self' https://element.example.com

upstream gif_widget {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name gif.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gif.example.com;

    # --- TLS ---
    ssl_certificate     /etc/letsencrypt/live/gif.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gif.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # --- Security headers (supplemental — CSP comes from Express) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Rate limiting zone (requires nginx limit_req module)
    limit_req_zone $binary_remote_addr zone=gifapi:10m rate=60r/m;
    limit_req_status 429;

    # --- Access logging ---
    access_log /var/log/nginx/gif-widget.access.log;
    error_log  /var/log/nginx/gif-widget.error.log;

    # --- API proxy routes with rate limiting ---
    location /health {
        proxy_pass http://gif_widget;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tenor/ {
        limit_req zone=gifapi burst=10 nodelay;
        proxy_pass http://gif_widget;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /giphy/ {
        limit_req zone=gifapi burst=10 nodelay;
        proxy_pass http://gif_widget;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Static SPA ---
    location / {
        proxy_pass http://gif_widget;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}