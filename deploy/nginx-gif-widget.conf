# Matrix GIF Widget — nginx reverse proxy config
# Place in /etc/nginx/sites-available/gif-widget
# Symlink to /etc/nginx/sites-enabled/gif-widget
# Adjust server_name to your actual domain

upstream gif_widget {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name gif.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gif.yourdomain.com;

    # --- TLS ---
    ssl_certificate     /etc/letsencrypt/live/gif.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gif.yourdomain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS — enforce HTTPS for all future requests
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # --- Security headers ---
    # Must allow iframe embedding for Matrix widgets
    add_header X-Frame-Options "ALLOWALL" always;
    add_header Content-Security-Policy "frame-ancestors *; default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://media.tenor.com https://media.giphy.com https://*.tenor.com https://*.giphy.com; connect-src 'self' https://tenor.googleapis.com https://api.giphy.com;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Access logging ---
    access_log /var/log/nginx/gif-widget.access.log;
    error_log  /var/log/nginx/gif-widget.error.log;

    # --- API proxy routes ---
    location /health {
        proxy_pass http://gif_widget;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tenor/ {
        proxy_pass http://gif_widget;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 5m;
        proxy_cache_bypass $http_cache_control;
    }

    location /giphy/ {
        proxy_pass http://gif_widget;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 5m;
        proxy_cache_bypass $http_cache_control;
    }

    # --- Static SPA ---
    location / {
        proxy_pass http://gif_widget;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Cache static assets
        location ~* \.(js|css|svg|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|webp)$ {
            proxy_pass http://gif_widget;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache_valid 200 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Frame-Options "ALLOWALL" always;
            add_header Content-Security-Policy "frame-ancestors *; default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://media.tenor.com https://media.giphy.com https://*.tenor.com https://*.giphy.com;" always;
        }
    }
}