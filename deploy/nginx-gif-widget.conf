# Rate limiting zone — MUST be at http context level (outside server block)
# If your nginx.conf doesn't include conf.d/ inside http{}, move this line
# to /etc/nginx/nginx.conf inside the http { } block instead.
limit_req_zone $binary_remote_addr zone=gifapi:10m rate=60r/m;

# Matrix GIF Widget — nginx reverse proxy config
# Place in /etc/nginx/sites-available/gif-widget
# Symlink to /etc/nginx/sites-enabled/gif-widget
#
# IMPORTANT: Update server_name, ssl_certificate paths, and
# the upstream IP to point at your widget server.
#
# The widget is designed to be loaded DIRECTLY by Element as a native
# m.stickerpicker widget — NOT through scalar.vector.im.
# Set it up via Element > Settings > Integrations > Add widget, or
# via Matrix account data (m.stickerpicker) pointing to:
#   https://WIDGET_DOMAIN/?provider=tenor
#
# SECURITY: The Express server sends CSP with frame-ancestors.
# Set FRAME_ANCESTORS env var in docker-compose to control which
# Matrix clients can embed this widget. Default: 'self'
# For Element Web, use: FRAME_ANCESTORS='self' https://element.example.com

upstream gif_widget {
    server 127.0.0.1:3000;
    keepalive 32;
}

# --- HTTP → HTTPS redirect ---
server {
    listen 80;
    server_name WIDGET_DOMAIN;
    return 301 https://$host$request_uri;
}

# --- HTTPS server ---
server {
    listen 443 ssl http2;
    server_name WIDGET_DOMAIN;

    # --- TLS ---
    ssl_certificate     /etc/letsencrypt/live/WIDGET_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/WIDGET_DOMAIN/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # --- Security headers (supplemental — CSP comes from Express) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Access logging ---
    access_log /var/log/nginx/gif-widget.access.log;
    error_log  /var/log/nginx/gif-widget.error.log;

    # Common proxy headers (DRY)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # --- Health check (no rate limit) ---
    location /health {
        proxy_pass http://gif_widget;
    }

    # --- Tenor API proxy (rate limited) ---
    location /tenor/ {
        limit_req zone=gifapi burst=10 nodelay;
        proxy_pass http://gif_widget;
        proxy_cache_valid 200 5m;
    }

    # --- Giphy API proxy (rate limited) ---
    location /giphy/ {
        limit_req zone=gifapi burst=10 nodelay;
        proxy_pass http://gif_widget;
        proxy_cache_valid 200 5m;
    }

    # --- Media proxy (rate limited, cacheable images/GIFs) ---
    # Proxies media.tenor.com and media.giphy.com through our domain
    # so the iframe CSP doesn't block direct fetches.
    # URLs like /media/tenor/abc123/xyz.gif → https://media.tenor.com/abc123/xyz.gif
    location /media/ {
        limit_req zone=gifapi burst=20 nodelay;
        proxy_pass http://gif_widget;

        # Cache media for 24h — GIFs are immutable
        proxy_buffering on;
        proxy_cache_valid 200 86400s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400" always;

        # CORS — allow any Matrix client iframe to fetch media
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    }

    # --- Static SPA + widget HTML ---
    location / {
        proxy_pass http://gif_widget;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}